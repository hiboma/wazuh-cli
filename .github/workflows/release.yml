name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build-release:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      attest: true

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: artifacts

      - name: Verify release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum --check sha256sums.txt
          for artifact in wazuh-cli-*.tar.gz wazuh-cli-*.zip sha256sums.txt; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml"
          done

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/wazuh-cli-*.tar.gz
            artifacts/wazuh-cli-*.zip
            artifacts/sha256sums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "${TAG_NAME}" --repo "$GITHUB_REPOSITORY" --draft=false
