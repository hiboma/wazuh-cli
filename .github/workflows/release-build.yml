name: Release build

on:
  workflow_call:
    inputs:
      attest:
        description: Sign the release bundle (tag pushes only)
        type: boolean
        default: false

# The bundle job inherits the caller's permissions: CI grants contents: read,
# while Release also grants id-token: write and attestations: write.

jobs:
  build-release:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cross build --locked --release --target "${BUILD_TARGET}"

      - name: Build (native)
        if: "!matrix.cross"
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "${BUILD_TARGET}"

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_NAME="wazuh-cli-${TARGET}"
          mkdir "${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/wazuh-cli" "${ARCHIVE_NAME}/"
          cp LICENSE README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $archiveName = "wazuh-cli-${env:TARGET}"
          New-Item -ItemType Directory -Path $archiveName
          Copy-Item "target\${env:TARGET}\release\wazuh-cli.exe" $archiveName
          Copy-Item LICENSE, README.md $archiveName
          Compress-Archive -Path $archiveName -DestinationPath "${archiveName}.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wazuh-cli-${{ matrix.target }}
          path: wazuh-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wazuh-cli-${{ matrix.target }}
          path: wazuh-cli-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: build-release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag push for signing
        if: inputs.attest && (github.event_name != 'push' || github.ref_type != 'tag')
        run: |
          echo 'Release attestations require a tag push.' >&2
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wazuh-cli-*
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- *.tar.gz *.zip > sha256sums.txt

      - name: Attest build provenance
        if: inputs.attest && github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            artifacts/wazuh-cli-*.tar.gz
            artifacts/wazuh-cli-*.zip
            artifacts/sha256sums.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 1
          path: |
            artifacts/wazuh-cli-*.tar.gz
            artifacts/wazuh-cli-*.zip
            artifacts/sha256sums.txt

