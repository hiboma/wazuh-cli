name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  actions-lock:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  security-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/security-checks.yml

  build:
    needs: security-gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
